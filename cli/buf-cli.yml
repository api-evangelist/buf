name: buf
description: 'The Buf CLI is the primary client for everything Buf sells: it compiles, lints, formats,
  breaking-change-checks and generates code from Protobuf, and it is also the authenticated client for
  the Buf Schema Registry. For most users it, not the HTTP API, IS the API.'
repository: https://github.com/bufbuild/buf
license: Apache-2.0
version: 1.73.0
version_date: '2026-09-11'
language: Go
install:
- method: homebrew
  command: brew install bufbuild/buf/buf
  registry: homebrew/core + bufbuild/homebrew-buf tap
- method: npm
  command: npm install @bufbuild/buf
  package: https://www.npmjs.com/package/@bufbuild/buf
- method: go
  command: go install github.com/bufbuild/buf/cmd/buf@latest
- method: binary
  command: download from https://github.com/bufbuild/buf/releases
- method: docker
  command: docker run bufbuild/buf
- method: github-action
  command: bufbuild/buf-setup-action
  note: plus buf-action, buf-lint-action, buf-breaking-action, buf-push-action
auth:
  command: buf registry login
  env: BUF_TOKEN
  store: $HOME/.netrc
  logout: buf registry logout
