specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Buf
providerId: buf
created: '2026-05-04'
modified: '2026-09-13'
generated: '2026-09-13'
method: searched
source: https://buf.build/pricing
docs: https://buf.build/pricing
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file. Its tiers and
  quotas were placeholder values (a fabricated "1000 API requests/month" free tier) and
  have been replaced entirely by Buf's published pricing.
description: >-
  Buf's published plans for the Buf Schema Registry. Billing is per TYPE per month — a
  Protobuf-native meter, counting the types (messages, enums, services) stored in the
  registry rather than API calls or seats.
billing:
  unit: type
  unit_definition: >-
    Buf links a "Learn more about types based billing" explainer from the pricing page;
    the docs path for it was not resolvable on 2026-09-13 (404), so only the pricing page
    itself is cited here.
  period: month
  currency: USD
plan_count: 4
plans:
  - id: buf-community
    name: Community
    type: free
    price: '0.00'
    currency: USD
    period: month
    cta: Try it for Free
    entries:
      - name: private_repositories
        label: Private repositories
        limit: 1
      - name: public_repositories
        label: Public repositories
        limit: unlimited
      - name: support
        label: Support
        value: Community Slack channel
    features: [Dependency management, Generated documentation, Generated SDKs, Remote plugins, Runtime API access]
    uptime_sla: none
  - id: buf-teams
    name: Teams
    type: usage
    price: '0.50'
    price_unit: per type / month
    currency: USD
    period: month
    trial: 30 days
    entries:
      - name: private_repositories
        label: Private repositories
        limit: unlimited
      - name: support_response
        label: Email support response
        value: 48 business hours
    features: [Everything in Community, Unlimited private repositories]
    uptime_sla: none
  - id: buf-pro
    name: Pro
    type: usage
    price: '5.00'
    price_unit: per type / month
    currency: USD
    period: month
    minimum_spend: '3000.00'
    minimum_spend_period: month
    trial: 30 days
    entries:
      - name: support_response
        label: Email support response
        value: 48 business hours
      - name: uptime_sla
        label: Uptime SLA
        value: '99%'
    features:
      - Private instance of the BSR
      - Unlimited organizations
      - Hosted custom plugins
      - Custom SSO with SAML and OIDC
      - Dedicated subdomain
      - Comprehensive audit logging
      - SCIM server admin and bulk user management
      - Access to SOC 2 Audit and Pen Test Reports
      - Custom plugins
      - Recommended SDKs
      - Policy Checks
      - Custom UI theme
    rate_limited: false
  - id: buf-enterprise
    name: Enterprise
    type: custom
    price: null
    price_note: Custom — contact sales
    currency: USD
    period: month
    entries:
      - name: uptime_sla
        label: Uptime SLA
        value: '99.5%'
      - name: support_response
        label: Support
        value: 48 business hours plus dedicated Slack channel and a named Customer Engineer
    features:
      - Full data isolation and dedicated resources
      - Self-hosted / on-prem deployments available
      - Custom resource and deployment commitments
      - Custom data retention policies
      - Custom maintenance windows
      - Custom UI theme
      - Procurement support
      - Custom security and data privacy questionnaires
      - Custom contracting terms considered
    rate_limited: false
signup: https://buf.build/signup
contact_sales: https://buf.build/contact
note: >-
  Pricing is published openly for three of four tiers; only Enterprise is a contact-sales
  quote. Rate limits are NOT a plan attribute on the public BSR — Buf applies them to all
  traffic regardless of plan and removes them only on dedicated Pro/Enterprise instances.
  See rate-limits/buf-rate-limits.yml.
