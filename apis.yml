aid: buf
name: Buf
description: >-
  Buf Technologies builds the modern toolchain for Protocol Buffers and gRPC: the buf CLI,
  the Buf Schema Registry (BSR), Protovalidate, Protobuf-ES and Protobuf-Py, and the Connect
  protocol, which is now a CNCF project. It replaces protoc-based workflows with linting,
  breaking-change detection, code generation, remote plugins, policy checks and centralized
  schema distribution. Buf's own public API is published as Protobuf rather than OpenAPI —
  33 services and 85 RPCs served over Connect, gRPC and gRPC-Web at the root of buf.build,
  Apache-2.0 licensed at github.com/bufbuild/registry-proto — and the same surface is exposed
  to agents as a remote MCP server at https://buf.build/mcp. Used by enterprises including
  EA, Intel, IBM, OpenAI and Okta. Bufstream, Buf's Kafka-compatible streaming platform, was
  acquired by CoreWeave in May 2026 and is no longer a Buf product.
