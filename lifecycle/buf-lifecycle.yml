generated: '2026-09-13'
method: searched
source: https://github.com/bufbuild/registry-proto + https://buf.build/pricing + https://www.bufstatus.com/
docs:
  - https://github.com/bufbuild/registry-proto
  - https://buf.build/pricing
  - https://buf.build/docs/bsr/commits-labels/
versioning:
  scheme: package-versioned Protobuf (v1 / v1beta1 / alpha)
  current:
    registry_api: buf.registry.*.v1 (stable) with v1beta1 for plugin and policy services
    reflect_api: buf.reflect.v1beta1 (beta)
    cli: 1.73.0 (2026-09-11)
  policy: >-
    v1 packages are stable and will not change in backward-incompatible ways; alpha and
    beta packages may. Buf runs its own `buf breaking` WIRE_JSON check against registry-proto
    in CI, so the stability promise is machine-enforced rather than only written down.
  source: https://github.com/bufbuild/registry-proto
deprecation:
  policy_published: true
  mechanism:
    - name: module deprecation
      description: >-
        A BSR module can be marked deprecated and later un-deprecated; the deprecated state
        is carried on the Module resource in the contract.
      operations: ['buf registry module deprecate', 'buf registry module undeprecate']
      docs: https://buf.build/docs/reference/cli/buf/registry/module/deprecate/
    - name: schema-level deprecation
      description: >-
        Field, message, enum and RPC deprecation is expressed with the Protobuf `deprecated`
        option and surfaced in generated documentation and the LSP.
    - name: label archiving
      description: 'ArchiveLabels / UnarchiveLabels retire a label without deleting history.'
  sunset_header: not published
  deprecation_header: not published
  rfc8594: false
  alpha_surface_warning: >-
    Buf explicitly labels the webhook surface (buf.alpha.webhook.v1alpha1,
    buf.alpha.registry.v1alpha1 and the `buf beta registry webhook` commands) as alpha and
    says to "expect them to change".
