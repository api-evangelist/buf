summary: >-
  Two distinct classes of package sit under the Buf name and they should not be conflated.
  (1) First-party OSS libraries and tools Buf publishes to the public registries — the CLI,
  the Protobuf runtimes, Protovalidate. (2) GENERATED SDKs the Buf Schema Registry produces
  on demand from any module, served from Buf's own registry endpoints (buf.build/gen/go,
  buf.build/gen/npm, buf.build/gen/maven, ...). The generated SDKs for
  buf.build/bufbuild/registry are the closest thing Buf ships to a client library for its
  own API, and they are listed separately below.
