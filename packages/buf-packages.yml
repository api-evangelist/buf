generated_sdks:
  description: >-
    SDKs the BSR generates from a module on demand. These are how a consumer gets a typed
    client for Buf's OWN API. Go is served through the Go module proxy protocol; the other
    languages are served from BSR-hosted registry endpoints rather than the public
    registries, so most have no public metadata endpoint to query.
  docs: https://buf.build/docs/bsr/generated-sdks/
  packages:
    - name: buf.build/gen/go/bufbuild/registry/protocolbuffers/go
      registry: go
      language: Go
      kind: generated-sdk
      official: true
      version: v1.36.12-20260831211851-b4432e12a6e7.2
      published: '2026-09-03'
      note: Message types for the public BSR API. Version string encodes plugin version + module commit.
    - name: buf.build/gen/go/bufbuild/registry/connectrpc/go
      registry: go
      language: Go
      kind: generated-sdk
      official: true
      version: v1.21.0-20260831211851-b4432e12a6e7.1
      published: '2026-09-08'
      note: Connect client for the public BSR API.
    - name: '@buf/bufbuild_registry.<plugin>'
      registry: bsr-npm
      registry_url: https://buf.build/gen/npm/v1
      language: TypeScript
      kind: generated-sdk
      official: true
      version: null
      published: null
      note: >-
        Checked and absent from the PUBLIC npm registry — registry.npmjs.org returns
        "Not found" for @buf/bufbuild_registry.* — because @buf packages are served from
        Buf's own npm endpoint, which requires an .npmrc pointing at buf.build/gen/npm/v1.
        No unauthenticated metadata endpoint exists, so version and date are recorded null.
    - name: 'Maven / Cargo / NuGet / Swift / CMake generated SDKs'
      registry: bsr
      language: multiple
      kind: generated-sdk
      official: true
      version: null
      published: null
      note: >-
        The BSR serves each language from its own hosted registry surface. Versions are
        per-commit and generated on demand, so there is no single "latest version" to read.
currency_finding: >-
  The JavaScript, Python and Go lines are current — five packages released within two days
  of this pass and nothing core older than five months. The JVM line is not. Every
  build.buf Maven artifact predates 2026: the CLI at 1.53.0 (2025-04-21) against 1.73.0
  elsewhere, protovalidate at 0.7.0 (2025-05-01) while the Go and Python Protovalidate
  lines have reached 1.4.0 and 2.0.0, and the Gradle plugin at 0.10.0 (2024-09-05). A Java
  or Kotlin consumer is the only one on this list being served a materially older Buf.
