domain_standard:
  market: 'Protobuf schema registry / API schema governance'
  finding: >-
    This market's de facto interchange standard is Protocol Buffers itself, and Buf does not
    merely conform to it — it authors the toolchain, publishes a written language
    specification (bufbuild/protobuf-language-spec), and ships its own public API as
    Protobuf modules on its own registry. The nearest COMPETING domain standard is
    Confluent's Schema Registry protocol, and Buf publishes bufbuild/confluent-proto,
    "Proto definitions for integrating Confluent Schema Registry with the BSR", plus Kafka
    serializer/deserializer libraries for Go and Java that resolve schemas from the BSR.
  signature: 'buf.yaml module declarations (buf.build/bufbuild/registry), buf.validate field options, buf.lock dependency pinning'
  evidence:
    - grpc/buf/registry/module/v1/module_service.proto
    - https://github.com/bufbuild/confluent-proto
    - https://github.com/bufbuild/bsr-kafka-serde-go
