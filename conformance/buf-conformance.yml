summary: >-
  Buf's compliance posture is unusual: it is largely expressed as CONTRACT, not as prose.
  The transports, the validation language and the schema format are all published
  specifications Buf either implements or authors, and the OAuth surface is verifiable by
  fetching the provider's own discovery documents.
